[project]
name = "company-research-agent"
version = "0.1.0"
description = "LangGraph agent that researches a company on the web and writes a sourced report, with a human-in-the-loop approval step on the research plan."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23",
    "httpx>=0.28.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm'"
markers = [
    "integration: needs real infrastructure (docker compose services)",
    "llm: calls a real LLM through OpenRouter (manual only)",
]

[tool.coverage.run]
source = ["src/company_research_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["company_research_agent"]

[tool.deptry.per_rule_ignores]
# langchain: imported at runtime by langfuse.langchain; uvicorn: the API server command.
DEP002 = ["langchain", "uvicorn"]
